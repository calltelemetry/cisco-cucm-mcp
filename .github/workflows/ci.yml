name: CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit production dependencies
        run: yarn npm audit --environment production || true

      # Public repo: every tracked file is a disclosure channel (ADR 1032).
      # Internal addresses and hostnames fail here; RFC 5737 ranges are allowed.
      - name: Source scan for internal identifiers (ADR 1032)
        run: yarn scrub:source

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint --max-warnings=25

      - name: Test with coverage
        run: yarn vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        run: yarn build

      - name: Verify built MCP version
        run: yarn test:built-version

      - name: Publish scrub gate (ADR 1032)
        run: yarn scrub:publish

      # Proves the package packs and passes npm's publish-time checks on every
      # PR and merge-queue run, without touching the registry or any credential.
      - name: Publish dry run
        run: npm publish --dry-run --ignore-scripts --access public --provenance=false
